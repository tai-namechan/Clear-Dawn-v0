<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Clear Dawn - オフライン</title>
        <style>
            :root {
                color-scheme: light;
            }
            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
                box-sizing: border-box;
                background: #fbf7ef linear-gradient(180deg, #fbf7ef 0%, #eeeaf6 100%);
                color: #23223a;
                font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            }
            main {
                width: 100%;
                max-width: 360px;
                padding: 32px 24px;
                border: 1px solid rgba(150, 128, 92, 0.24);
                border-radius: 24px;
                background: #fdfaf4;
                text-align: center;
                box-shadow: 0 14px 44px rgba(37, 32, 74, 0.08);
            }
            h1 {
                margin: 16px 0 8px;
                font-family: 'Hiragino Mincho ProN', 'Shippori Mincho', serif;
                font-size: 22px;
                letter-spacing: 0.06em;
            }
            p {
                margin: 0;
                color: #55505f;
                font-size: 14px;
                line-height: 1.7;
            }
            .rule {
                width: 48px;
                height: 2px;
                margin: 0 auto;
                background: #d4b370;
            }
            button {
                margin-top: 24px;
                width: 100%;
                height: 48px;
                border: 0;
                border-radius: 999px;
                background: linear-gradient(135deg, #7a73b8 0%, #565090 100%);
                color: #fff;
                font-size: 16px;
                font-weight: 700;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="rule" aria-hidden="true"></div>
            <h1>接続できません</h1>
            <p>インターネットにつながっていないようです。<br />接続を確認してから、もう一度お試しください。</p>
            <button type="button" id="retry">もう一度読み込む</button>
        </main>
        <script src="app-config.js"></script>
        <script>
            document.getElementById('retry').addEventListener('click', function () {
                if (window.CD_SERVER_URL) {
                    window.location.replace(window.CD_SERVER_URL);
                } else {
                    window.location.reload();
                }
            });
        </script>
    </body>
</html>
