# Local development services. Production runs on Laravel Cloud (MySQL 8.4).
# See docs/dev/environments.md.
name: clear-dawn

services:
    mysql:
        image: mysql:8.4
        ports:
            # Bound to loopback only: reachable from this PC (incl. MySQL
            # Workbench on Windows), never from the LAN.
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}'
            MYSQL_DATABASE: '${DB_DATABASE:?Set DB_DATABASE in .env}'
            MYSQL_USER: '${DB_USERNAME:?Set DB_USERNAME in .env}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_ROOT_PASSWORD}']
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql-data:
